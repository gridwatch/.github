---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Go Module Tag

# Cuts the next patch tag for a library module when main moves: consumers
# resolve by tag, so an untagged merge is invisible to every one of them.
# Not go-release — these modules have no `cmd/`; the tag is the deliverable.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The tag list is the input to the version bump, and a shallow clone
          # carries none of it: the next version would restart at v0.0.1.
          fetch-depth: 0

      - name: Cut the next patch tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Idempotence: a re-run, or a second push onto an already-tagged
          # commit, must not mint a second version for the same tree.
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          if [ -n "${existing}" ]; then
            echo "${SHA} is already tagged ${existing}; nothing to do"
            exit 0
          fi

          # -v:refname sorts by version, not lexically: a plain sort makes
          # v0.9.0 newer than v0.10.0 and moves the module backwards.
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest="${latest:-v0.0.0}"

          IFS='.' read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"

          # Patch only: a minor is a judgement call cut by hand, and an
          # automatic v2.0.0 is unadoptable — Go requires a /vN module path.
          echo "${latest} -> ${next}"

          # `gh release create` creates the tag at --target. It is authored by
          # GITHUB_TOKEN, so it fires no `push: tags` workflow — adding one here
          # means switching to an App token.
          gh release create "${next}" \
            --repo "${{ github.repository }}" \
            --target "${SHA}" \
            --title "${next}" \
            --generate-notes
