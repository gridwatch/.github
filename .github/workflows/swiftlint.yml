---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: SwiftLint

on:
  workflow_call:
    inputs:
      paths:
        description: 'Space-separated paths to lint'
        type: string
        default: 'Sources Tests'
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # private repository reads. Optional so public and fork callers run.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

# SHA for pushes, ref for pull requests, so a burst of pushes cannot leave a
# branch tip holding `cancelled` checks; see infrastructure-github AGENTS.md
# (Workflow concurrency). The caller's workflow name keeps two callers in one
# repo apart, and the event keeps the nightly cache warm from cancelling a
# push run on the same commit.
concurrency:
  group: ${{ github.repository }}-swiftlint-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
      # The caller's nightly schedule is the only run that saves a cache.
      WARM_CACHE: ${{ github.event_name == 'schedule' }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Mints a per-run installation token for the private repository reads below.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: tooling
          permission-contents: read

      - name: Checkout tooling
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling

      # The release archive is cached, never the unpacked binary, so the
      # checksum below verifies a restored copy exactly as it does a download.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Restore SwiftLint archive
        id: swiftlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/swiftlint-release
          key: swiftlint-${{ runner.os }}-0.65.0-79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.65.0"
          SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
        run: |
          zip="${HOME}/.cache/swiftlint-release/swiftlint.zip"
          if [ ! -f "${zip}" ]; then
            mkdir -p "${HOME}/.cache/swiftlint-release"
            curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o "${zip}"
          fi
          echo "${SWIFTLINT_SHA256}  ${zip}" | sha256sum -c -
          install_dir="$(mktemp -d)"
          mkdir -p "${install_dir}/bin"
          unzip -q -j "${zip}" swiftlint-static -d "${install_dir}/bin"
          mv "${install_dir}/bin/swiftlint-static" "${install_dir}/bin/swiftlint"
          chmod +x "${install_dir}/bin/swiftlint"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      # A path containing "Tests" lints against swiftlint-tests.yml (relaxed
      # rules for idiomatic test patterns); everything else uses the main config.
      - name: Run SwiftLint
        if: env.WARM_CACHE != 'true'
        env:
          LINT_PATHS: ${{ inputs.paths }}
        run: |
          read -r -a lint_paths <<< "$LINT_PATHS"
          src_paths=()
          test_paths=()
          for path in "${lint_paths[@]}"; do
            case "$path" in
              *Tests*) test_paths+=("$path") ;;
              *) src_paths+=("$path") ;;
            esac
          done
          if [ "${#src_paths[@]}" -gt 0 ]; then
            swiftlint lint --strict --config ../tooling/swiftlint.yml "${src_paths[@]}"
          fi
          if [ "${#test_paths[@]}" -gt 0 ]; then
            swiftlint lint --strict --config ../tooling/swiftlint-tests.yml "${test_paths[@]}"
          fi

      # The one cache writer: the nightly run on main, once per release. A
      # pull request only restores.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Save SwiftLint archive
        if: env.WARM_CACHE == 'true' && steps.swiftlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/swiftlint-release
          key: ${{ steps.swiftlint-cache.outputs.cache-primary-key }}
