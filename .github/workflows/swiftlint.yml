---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: SwiftLint

on:
  workflow_call:
    inputs:
      paths:
        description: 'Space-separated paths to lint'
        type: string
        default: 'Sources Tests'
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # private repository reads. Optional so public and fork callers run.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Mints a per-run installation token for the private repository reads below.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout tooling
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.65.0"
          SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
        run: |
          install_dir="$(mktemp -d)"
          zip="${install_dir}/swiftlint.zip"
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o "${zip}"
          echo "${SWIFTLINT_SHA256}  ${zip}" | sha256sum -c -
          mkdir -p "${install_dir}/bin"
          unzip -q -j "${zip}" swiftlint-static -d "${install_dir}/bin"
          mv "${install_dir}/bin/swiftlint-static" "${install_dir}/bin/swiftlint"
          chmod +x "${install_dir}/bin/swiftlint"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      # A path containing "Tests" lints against swiftlint-tests.yml (relaxed
      # rules for idiomatic test patterns); everything else uses the main config.
      - name: Run SwiftLint
        env:
          LINT_PATHS: ${{ inputs.paths }}
        run: |
          read -r -a lint_paths <<< "$LINT_PATHS"
          src_paths=()
          test_paths=()
          for path in "${lint_paths[@]}"; do
            case "$path" in
              *Tests*) test_paths+=("$path") ;;
              *) src_paths+=("$path") ;;
            esac
          done
          if [ "${#src_paths[@]}" -gt 0 ]; then
            swiftlint lint --strict --config ../tooling/swiftlint.yml "${src_paths[@]}"
          fi
          if [ "${#test_paths[@]}" -gt 0 ]; then
            swiftlint lint --strict --config ../tooling/swiftlint-tests.yml "${test_paths[@]}"
          fi
