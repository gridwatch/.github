---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Prose Super-Linter

on:
  workflow_call:
    inputs:
      # Accepted and IGNORED: Super-Linter fatally rejects a run mixing VALIDATE
      # true and false, so a `false` here would disable every linter in the repo.
      validate-yaml:
        description: 'Ignored - YAML is always validated'
        type: boolean
        default: true
      validate-bash:
        description: 'Ignored - Bash is always validated'
        type: boolean
        default: true
      filter-regex-exclude:
        description: 'Regex to exclude files from linting'
        type: string
        default: '(Taskfile\.yml|tooling/|_vendor/|\.specify/|specs/|\.claude/)'
      copy-yamllint-config:
        description: 'Copy yamllint.yml from tooling into workspace'
        type: boolean
        default: false
      # The fleet config assumes a standalone document (no inline HTML, one h1,
      # no repeated headings); Hugo content repos name a config for that shape.
      markdown-config:
        description: 'markdownlint config filename in gridwatch/.github'
        type: string
        default: 'markdownlint.yml'

permissions:
  contents: read

jobs:
  superlinter:
    name: superlinter
    runs-on: ubuntu-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Cloned outside the workspace and copied in: Super-Linter v8 resolves
      # DEFAULT_BRANCH with git at the workspace root, so the caller must stay
      # there — and a config checked out inside it would be linted.
      - name: Checkout linter configs
        run: git clone --depth 1 --branch main --single-branch https://github.com/gridwatch/.github.git ../fleet-config

      - name: Copy linter configs into workspace
        env:
          COPY_YAMLLINT_CONFIG: ${{ inputs.copy-yamllint-config }}
          MARKDOWN_CONFIG: ${{ inputs.markdown-config }}
        run: |
          mkdir -p .github/linters
          cp "../fleet-config/${MARKDOWN_CONFIG}" .github/linters/.markdownlint.yml
          if [ "${COPY_YAMLLINT_CONFIG}" = "true" ]; then
            cp ../fleet-config/yamllint.yml .github/linters/.yamllint.yml
          fi

      # see: https://github.com/super-linter/super-linter/releases/tag/v8.7.0
      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918  # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true

          # Named explicitly: v8 auto-discovery does not see the files the copy
          # step writes, and the run silently uses the bundled defaults instead.
          MARKDOWN_CONFIG_FILE: .markdownlint.yml
          YAML_CONFIG_FILE: ${{ inputs.copy-yamllint-config && '.yamllint.yml' || '.yaml-lint.yml' }}

          FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude }}
