---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Swift App Test

on:
  workflow_call:
    inputs:
      project:
        description: 'Xcode project file'
        type: string
        required: true
      scheme:
        description: 'Xcode scheme to test'
        type: string
        required: true
      simulator:
        description: 'Simulator name'
        type: string
        required: true
      tv_simulator:
        description: 'Apple TV simulator name; empty skips the tvOS pass'
        type: string
        required: false
        default: ''
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # private repository reads. Optional so public and fork callers run.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

# SHA for pushes, ref for pull requests, so a burst of pushes cannot leave a
# branch tip holding `cancelled` checks; see infrastructure-github AGENTS.md
# (Workflow concurrency). The caller's workflow name keeps two callers in one
# repo apart, and the event keeps the nightly cache warm from cancelling a
# push run on the same commit.
concurrency:
  group: ${{ github.repository }}-swift-app-test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    # Org-wide macOS runner switch; see AGENTS.md (macOS runner gate). Unset or
    # anything but "true" means disabled.
    if: ${{ vars.MACOS_RUNNERS_ENABLED == 'true' }}
    runs-on: macos-26
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
      # The caller's weekly schedule resolves and saves instead of testing.
      WARM_CACHE: ${{ github.event_name == 'schedule' }}
    # A cap so a wedged step can never burn the full 6h default; the step caps,
    # not this one, are what make a stall fail fast.
    timeout-minutes: 90
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Warm runs only. When every cache this job saves already exists for
      # its key there is nothing to write, so the rest of the job is skipped
      # instead of spending macOS minutes rebuilding what is stored.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Look up Swift package cache
        id: spm-probe
        if: env.WARM_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('project.yml', 'Package.resolved') }}
          lookup-only: true

      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Look up XcodeGen cache
        id: xcodegen-probe
        if: env.WARM_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/xcodegen
          key: xcodegen-2.46.0-4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          lookup-only: true

      - name: Skip a warm run with nothing to save
        if: steps.spm-probe.outputs.cache-hit == 'true' && steps.xcodegen-probe.outputs.cache-hit == 'true'
        run: echo "SKIP_REST=true" >> "${GITHUB_ENV}"

      # Mints a per-run installation token for the private repository reads.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' && env.SKIP_REST != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: FDTKit,tooling
          permission-contents: read

      - name: Checkout sibling repositories
        if: env.SKIP_REST != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/FDTKit.git" ../FDTKit
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling

      # The release archive is cached, never the unpacked binary, so the
      # checksum below verifies a restored copy exactly as it does a download.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Restore XcodeGen archive
        id: xcodegen-cache
        if: env.SKIP_REST != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/xcodegen
          key: xcodegen-2.46.0-4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

      - name: Install XcodeGen
        if: env.SKIP_REST != 'true'
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          zip="${HOME}/.cache/xcodegen/xcodegen.zip"
          if [ ! -f "${zip}" ]; then
            mkdir -p "${HOME}/.cache/xcodegen"
            curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${zip}"
          fi
          echo "${XCODEGEN_SHA256}  ${zip}" | shasum -a 256 -c -
          install_dir="$(mktemp -d)"
          unzip -q "${zip}" -d "${install_dir}"
          echo "${install_dir}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate Xcode project
        if: env.SKIP_REST != 'true'
        run: xcodegen generate

      # xcodegen writes a fresh .xcodeproj, so without re-seeding the committed
      # lockfile every run re-resolves the ranges in project.yml and upstream
      # can change what is built with no commit here. Mirrors `task generate`.
      - name: Seed committed package pins
        if: env.SKIP_REST != 'true'
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          if [ -f Package.resolved ]; then
            dir="${PROJECT}/project.xcworkspace/xcshareddata/swiftpm"
            mkdir -p "${dir}"
            cp Package.resolved "${dir}/Package.resolved"
            echo "seeded pins:"
            # `|| true` because this is logging: under pipefail a grep miss
            # would otherwise fail package resolution over a cosmetic summary.
            grep -E '"(identity|version)"' Package.resolved | paste - - | sed 's/^/  /' || true
          else
            echo "no committed Package.resolved — resolving from project.yml ranges"
          fi

      # Keyed on project.yml and Package.resolved: on project.yml alone a pin
      # bump would serve a stale cache. The save below must stay success-only —
      # a cache from a killed resolve has no artifacts/ and reproduces the stall.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Restore cached Swift packages
        id: spm-cache
        if: env.SKIP_REST != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('project.yml', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ github.repository }}-

      # `-packageAuthorizationProvider netrc` is required, not tidying: the
      # default credential store blocks forever on the Keychain on a headless
      # runner. GIT_TERMINAL_PROMPT=0 is the same hazard in git.
      - name: Resolve Swift packages
        if: env.SKIP_REST != 'true'
        timeout-minutes: 10
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          xcodebuild -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -clonedSourcePackagesDirPath .spm-cache \
            -packageAuthorizationProvider netrc \
            -resolvePackageDependencies

      - name: Run tests
        if: env.WARM_CACHE != 'true'
        timeout-minutes: 30
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          SIMULATOR: ${{ inputs.simulator }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          xcodebuild -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -clonedSourcePackagesDirPath .spm-cache \
            -packageAuthorizationProvider netrc \
            test

      # A step rather than a second job, so repos without a tvOS destination
      # carry no skipped check.
      - name: Run tvOS tests
        if: inputs.tv_simulator != '' && env.WARM_CACHE != 'true'
        timeout-minutes: 30
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          TV_SIMULATOR: ${{ inputs.tv_simulator }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          xcodebuild -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination "platform=tvOS Simulator,name=${TV_SIMULATOR}" \
            -clonedSourcePackagesDirPath .spm-cache \
            -packageAuthorizationProvider netrc \
            test

      # Written only by the weekly run on main; a pull request restores and
      # never saves, so it cannot publish what main later reads. Success-only
      # by default, so a failed resolve never publishes a half-written package
      # directory. Skipped on an exact key hit.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Save Swift package cache
        if: env.WARM_CACHE == 'true' && env.SKIP_REST != 'true' && steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('project.yml', 'Package.resolved') }}

      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Save XcodeGen archive
        if: env.WARM_CACHE == 'true' && env.SKIP_REST != 'true' && steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/xcodegen
          key: xcodegen-2.46.0-4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
