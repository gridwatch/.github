---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: macOS Release Sign

# Signs and publishes a macOS release that was built and notarized on a Mac
# (`task release-mac`) and left there as a draft carrying its zip, with its
# tag pushed after it (`task publish-mac`); the tag push is the trigger.
# Nothing is built here: the job adds an SPDX SBOM of the source tree,
# `checksums.txt` over the zips and that SBOM, and a cosign bundle
# over `checksums.txt` (the three assets the goreleaser configs publish for
# the Go apps), then publishes the draft.
#
# A draft, because the organization enforces immutable releases: a published
# release takes no further assets, so the signature has to land first.
#
# The signing identity is this file's path, not the caller's: a reusable's
# OIDC token names the called workflow in `job_workflow_ref`, which Fulcio
# writes into the certificate's SAN. Verify against it:
#
#   cosign verify-blob checksums.txt \
#     --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/gridwatch/\.github/\.github/workflows/macos-release-sign\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-github-workflow-repository <owner>/<repo>

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag of the draft release to sign and publish (vYYYYMMDD-N); the draft must already carry its zips'
        type: string
        required: true
      source-name:
        description: 'Name recorded in the SBOM for the scanned source tree (e.g. Verda)'
        type: string
        required: true

permissions:
  contents: read

# One signing run per tag at a time, never cancelled: two runs on one tag
# would each upload a checksums.txt, and the loser's bundle would sign a file
# the winner replaced. A caller must not use this group as its own.
concurrency:
  group: ${{ github.repository }}-macos-release-sign-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    name: sign
    runs-on: ubuntu-latest
    # contents: write uploads the three assets and publishes the draft;
    # id-token: write is the OIDC token cosign trades for a Fulcio
    # certificate. Nothing else is granted.
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The tag shape the publish task creates. Checked before any checkout or
      # download, so a hand-made release is refused rather than signed.
      - name: Check the tag
        run: |
          set -euo pipefail
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]{8}-[0-9]+$'; then
            echo "::error::${TAG} is not a vYYYYMMDD-N tag; refusing to sign it"
            exit 1
          fi

      # No cache, deliberately: this job publishes, and anything it restored
      # was written by a run that executed third-party code.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          # The full history, so the tag can be checked against main.
          fetch-depth: 0

      # Write access is enough to publish a release at an unmerged commit, and
      # a signature would then vouch for source that never passed review.
      - name: Check the tag is on main
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
            echo "::error::${TAG} (${commit}) is not on main; refusing to sign it"
            exit 1
          fi
          echo "${TAG} is ${commit}, on main"

      # Published releases are immutable, so only a draft can still take the
      # signature. Its target must be the tagged commit, or the draft and the
      # tag would describe different source.
      - name: Check the release is a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish)
          if [ "$(jq -r .isDraft <<<"${release}")" != "true" ]; then
            echo "::error::${TAG} is not a draft release; a published release is immutable and cannot take the signature"
            exit 1
          fi
          target=$(jq -r .targetCommitish <<<"${release}")
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "${target}" != "${commit}" ]; then
            echo "::error::the ${TAG} draft targets ${target}, but the tag is ${commit}"
            exit 1
          fi

      # Only the zips: a re-run must not fold the previous run's checksums or
      # SBOM into the new checksums.txt.
      - name: Download the release zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dist"
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.zip' \
            --dir "${RUNNER_TEMP}/dist"
          count=$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -type f -name '*.zip' | wc -l)
          if [ "${count}" -eq 0 ]; then
            echo "::error::the ${TAG} draft has no .zip asset; upload the notarized zip before pushing the tag"
            exit 1
          fi
          echo "downloaded ${count} zip(s)"

      # see: https://github.com/anchore/sbom-action/releases/tag/v0.24.0
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      # see: https://github.com/sigstore/cosign-installer/releases/tag/v4.1.2
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # The source tree at the tag, not the zip: a Swift app binary carries no
      # package metadata for syft to read, while Package.resolved files record
      # every resolved dependency, the vendored packages' included. One SBOM
      # per zip, named after it, as goreleaser's `sboms: artifacts: archive`.
      - name: Generate the SBOM
        env:
          SOURCE_NAME: ${{ inputs.source-name }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          sbom="${RUNNER_TEMP}/source.sbom.json"
          "${SYFT}" scan dir:. \
            --source-name "${SOURCE_NAME}" \
            --source-version "${TAG}" \
            --exclude './.git/**' \
            --exclude './build/**' \
            --exclude './**/.build/**' \
            --output "spdx-json=${sbom}"
          packages=$(jq '.packages | length' "${sbom}")
          swift=$(jq '[.packages[] | select(.externalRefs // [] | any(.referenceLocator | startswith("pkg:swift/")))] | length' "${sbom}")
          echo "SBOM lists ${packages} packages, ${swift} of them Swift packages"
          if [ "${swift}" -eq 0 ]; then
            echo "::error::syft found no Swift packages; the SBOM would be empty of dependencies"
            exit 1
          fi
          for zip in "${RUNNER_TEMP}"/dist/*.zip; do
            cp "${sbom}" "${zip}.sbom.json"
          done

      # Bare names, generated inside dist/, so `sha256sum -c checksums.txt`
      # works in a directory of downloaded assets.
      - name: Write checksums.txt
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          sha256sum -- *.zip *.sbom.json > checksums.txt
          cat checksums.txt

      - name: Sign checksums.txt
        working-directory: ${{ runner.temp }}/dist
        run: cosign sign-blob --bundle checksums.txt.sigstore.json --yes checksums.txt

      # The command a user runs, against the identity documented above, so a
      # bundle that would not verify for them is never uploaded.
      - name: Verify the signature
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/gridwatch/\.github/\.github/workflows/macos-release-sign\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}"
          sha256sum -c checksums.txt

      # --clobber, so a re-run replaces the assets of a failed earlier run.
      - name: Upload to the draft
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            checksums.txt checksums.txt.sigstore.json ./*.sbom.json

      # Last, and only after the signature verified: publishing makes the
      # release immutable. GITHUB_TOKEN publishes it, which triggers no further
      # workflow; nothing listens for it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
