---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: terraform-docs

on:
  workflow_call:
    inputs:
      working-dir:
        description: >-
          Comma-separated directories to document. A repository with more than
          one Terraform root module — `infrastructure-github`, whose workspaces
          are rooted at different directories — needs every root listed, or
          drift outside the first one is never checked.
        type: string
        default: '.'

# SHA for pushes, ref for pull requests -- see the long note in
# `terraform-superlinter.tftpl.yml`. A ref-keyed group lets runs for different
# commits cancel each other, and GitHub does not create them in commit order, so
# a burst of pushes can leave a branch tip holding `cancelled` checks. This
# workflow was the second casualty of exactly that on `terraform-cloudflare-r2`.
concurrency:
  group: ${{ github.repository }}-terraform-docs-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform-docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # see: https://github.com/terraform-docs/gh-actions/releases/tag/v1.4.1
      - name: Check terraform-docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c  # v1.4.1
        with:
          config-file: .terraform-docs.yml
          fail-on-diff: true
          # The action runs from the workspace root and prefers a config that
          # exists there, so one root `.terraform-docs.yml` serves every entry
          # and no per-directory copy is needed.
          working-dir: ${{ inputs.working-dir }}
