---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

# Builds a Hugo site and publishes a Cloudflare Pages *preview* for the pull
# request's head branch. Kept apart from hugo-deploy.yml (push to main only),
# or both would race to publish the same pull request and one would win at random.

name: Cloudflare Pages Preview

on:
  workflow_call:
    inputs:
      project-name:
        description: 'Cloudflare Pages project name'
        type: string
        required: true
    secrets:
      CLOUDFLARE_PAGES_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # see: https://github.com/peaceiris/actions-hugo/releases/tag/v3.2.1
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        run: hugo

      # wrangler-action spawns `command` directly (no shell), so the branch name
      # cannot inject; this guard pins the charset rather than trusting that.
      - name: Validate preview branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "${BRANCH}" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Refusing to deploy: unsafe characters in branch name: ${BRANCH}" >&2
            exit 1
          fi

      # see: https://github.com/cloudflare/wrangler-action/releases/tag/v4.0.0
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name="${{ inputs.project-name }}" --branch="${{ github.head_ref }}"

      # Values go through `env:` rather than inline interpolation:
      # `github.head_ref` is attacker-controlled on a fork pull request.
      - name: Summarise
        env:
          BRANCH: ${{ github.head_ref }}
          PROJECT: ${{ inputs.project-name }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare Pages preview"
            echo
            echo "- project: \`${PROJECT}\`"
            echo "- branch: \`${BRANCH}\`"
            echo "- url: ${URL:-<none reported>}"
          } >> "${GITHUB_STEP_SUMMARY}"
