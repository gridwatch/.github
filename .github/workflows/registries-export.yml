---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

# Turns a CAPSTONE export push on `craft-export` into a pull request against
# gridwatch/registries. Validation is deliberately not here: registries'
# own fdt-validate.yml runs `12b validate` on the pull request this opens.

name: Registries Export

on:
  workflow_call:
    secrets:
      EXPORT_APP_CLIENT_ID:
        description: 'Client ID of the CAPSTONE export GitHub App.'
        required: true
      EXPORT_APP_PRIVATE_KEY:
        description: 'Private key of the CAPSTONE export GitHub App.'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: craft-export
          fetch-depth: 0

      # An App token, because the automatic GITHUB_TOKEN cannot open pull
      # requests here: the org sets can_approve_pull_request_reviews = false.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.EXPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.EXPORT_APP_PRIVATE_KEY }}

      - name: Normalize exported JSON
        run: |
          set -euo pipefail
          # Hand-authored JSON that CAPSTONE does not generate. Normalizing
          # these would rewrite files the export does not own.
          skip_list="./exported-assets-manifest.json"
          changed=0
          while IFS= read -r -d '' file; do
            case " $skip_list " in
              *" $file "*) continue ;;
            esac
            tmp="$(mktemp)"
            jq --sort-keys . "$file" > "$tmp"
            if cmp -s "$file" "$tmp"; then
              rm -f "$tmp"
            else
              mv "$tmp" "$file"
              changed=$((changed + 1))
            fi
          done < <(find . -path ./.git -prune -o -name '*.json' -print0)
          echo "normalized $changed file(s)"

      - name: Reconcile against export manifest
        run: |
          set -euo pipefail
          if [ ! -f .export-manifest.json ]; then
            echo "no .export-manifest.json yet - reconcile skipped"
            exit 0
          fi
          jq -r '.records[]' .export-manifest.json | sort > /tmp/expected.txt
          find . -path ./.git -prune -o -name 'details.json' -print \
            | sed 's|^\./||' | sort > /tmp/actual.txt
          if ! diff -u /tmp/expected.txt /tmp/actual.txt > /tmp/reconcile.diff; then
            echo "::error::export manifest and tree disagree"
            echo "--- expected (manifest) vs +++ actual (tree) ---"
            cat /tmp/reconcile.diff
            exit 1
          fi
          echo "reconcile clean: $(wc -l < /tmp/expected.txt) record(s)"

      - name: Commit normalization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "nothing to normalize"
            exit 0
          fi
          git commit -am "chore: normalize exported JSON"
          git push

      # The App token, not GITHUB_TOKEN: the automatic one cannot open the PR.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # `gh pr list` exits 0 with empty output when nothing matches, so a
          # real failure still trips `set -e` rather than reading as "none open".
          existing="$(gh pr list --base main --head craft-export --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "pull request #$existing already open - the push updated it"
            exit 0
          fi
          # Body via heredoc, not an inline --body: a quoted string's continuation
          # lines keep this indentation, and >=4 spaces renders as a code block.
          gh pr create \
            --base main \
            --head craft-export \
            --title "chore: CAPSTONE export" \
            --body-file - <<'BODY'
          Generated by the CAPSTONE Blitz git deployer.

          Do not hand-edit this branch - the next export overwrites it.
          Reasoning for each change lives in the CAPSTONE entry revision named in the commit.
          BODY
