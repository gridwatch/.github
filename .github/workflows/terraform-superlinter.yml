---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Terraform Super-Linter

on:
  workflow_call:
    secrets:
      REPO_ACCESS_TOKEN:
        # Accepted (and currently unused) so callers that still pass it after
        # the .github/linters/ migration don't startup_failure with
        # "secret X is not declared on the called workflow". Drop this once
        # all caller workflows stop passing the secret.
        required: false

concurrency:
  group: ${{ github.repository }}-superlinter-${{ github.ref }}
  cancel-in-progress: true

# Write scopes so Super-Linter can post commit statuses and the PR summary
# comment. The comment posts to POST /issues/{n}/comments (Issues API even for
# a PR), governed by issues:write, not pull-requests:write. Callers grant the
# same scopes; whichever is narrower wins, so both must include them.
permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  superlinter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      # The caller and the shared configs are checked out as siblings under the
      # workspace, and `DEFAULT_WORKSPACE` below scopes linting to the caller.
      # That is what keeps Super-Linter from linting the config repository it
      # just fetched, without a `FILTER_REGEX_EXCLUDE` entry to maintain.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          path: main

      # The configs live in the public `.github` repository, so this needs no
      # credentials and behaves identically for a private caller, a public one,
      # and a fork's pull request. A config the workflow fetches for itself
      # cannot be missing from a freshly scaffolded repo, which is the failure
      # the per-repo copies existed to prevent.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: gridwatch/.github
          path: fleet-config

      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Cache Super-Linter image
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/super-linter-slim-v8.7.0.tar
          key: super-linter-slim-v8.7.0

      - name: Load cached image
        if: steps.cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/super-linter-slim-v8.7.0.tar

      - name: Pull and save image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/super-linter/super-linter:slim-v8.7.0
          docker save ghcr.io/super-linter/super-linter:slim-v8.7.0 > /tmp/super-linter-slim-v8.7.0.tar

      # see: https://github.com/super-linter/super-linter/releases/tag/v8.7.0
      - uses: super-linter/super-linter/slim@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true

          # Lint the caller only, not the config checkout beside it.
          #
          # The literal container path is deliberate. Super-Linter is a Docker
          # action, and the runner mounts the workspace at `/github/workspace`
          # inside it, so `github.workspace` — a host path — names a directory
          # that does not exist in the container.
          DEFAULT_WORKSPACE: /github/workspace/main

          VALIDATE_BASH: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_TERRAFORM_TFLINT: true
          VALIDATE_YAML: true

          # `LINTER_RULES_PATH` resolves relative to `DEFAULT_WORKSPACE`, so
          # this reaches the sibling checkout and no copy step is needed. The
          # two `*_CONFIG_FILE` names are still required — v8 auto-discovery
          # does not reliably find them, and without these the configs are
          # fetched and then ignored, silently falling back to the bundled
          # defaults (an 80-column YAML limit against the fleet's 320).
          LINTER_RULES_PATH: ../fleet-config
          MARKDOWN_CONFIG_FILE: markdownlint.yml
          YAML_CONFIG_FILE: yamllint.yml

          FILTER_REGEX_EXCLUDE: \.terraform/
