---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Terraform Super-Linter

on:
  workflow_call:

# Per-SHA on push, per-ref on pull request. A ref-keyed group on push makes runs
# for different commits cancel each other and leaves the tip's checks cancelled.
concurrency:
  group: ${{ github.repository }}-superlinter-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# The PR summary comment posts via the Issues API, so it needs issues:write,
# not pull-requests:write. Callers must grant the same scopes; narrower wins.
permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  superlinter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Cloned outside the workspace with plain git: Super-Linter resolves
      # DEFAULT_BRANCH against the workspace root, so the caller must stay there.
      - name: Checkout linter configs
        run: git clone --depth 1 --branch main --single-branch https://github.com/gridwatch/.github.git ../fleet-config

      # Super-Linter reads per-language configs from `.github/linters/`, so they
      # are copied in. The *_CONFIG_FILE vars below are still required.
      - name: Copy linter configs into workspace
        run: |
          mkdir -p .github/linters
          cp ../fleet-config/markdownlint.yml .github/linters/.markdownlint.yml
          cp ../fleet-config/yamllint.yml .github/linters/.yamllint.yml
          cp ../fleet-config/tflint.hcl .github/linters/.tflint.hcl

      # No packaged linter can express this: it fails the job on a `# see` link
      # whose version no longer matches its provider's `required_providers`.
      - name: Check `# see` link versions
        run: python3 ../fleet-config/terraform-see-links.py .

      # see: https://github.com/super-linter/super-linter/releases/tag/v8.7.0
      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918  # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true

          VALIDATE_BASH: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_TERRAFORM_TFLINT: true
          VALIDATE_YAML: true

          # v8 auto-discovery is unreliable; without these the copied configs
          # are ignored, losing the `*.tftpl.yml` exclude.
          MARKDOWN_CONFIG_FILE: .markdownlint.yml
          YAML_CONFIG_FILE: .yamllint.yml

          # Without this, tflint runs Super-Linter's bundled config, which pins
          # aws/azurerm/google rulesets at the image's versions, not the fleet's.
          TERRAFORM_TFLINT_CONFIG_FILE: .tflint.hcl

          FILTER_REGEX_EXCLUDE: \.terraform/
