---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Swift Package Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The runner's own Xcode toolchain — Package.swift asks for
      # swift-tools-version 6.2, so an open-source install buys nothing.
      - name: Run tests
        run: swift test
