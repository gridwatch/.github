---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Go Release

# Builds a tagged commit and publishes it as a GitHub release. The caller
# triggers on a `v*` tag push; nothing here decides what to publish.

on:
  workflow_call:
    inputs:
      binary-name:
        description: 'Output binary name, also the release asset prefix'
        type: string
        required: true
      main-package:
        description: 'Package path to build (e.g. ./cmd/terp)'
        type: string
        required: true
      version-var:
        description: >-
          Fully qualified variable to stamp the tag into, as accepted by
          `go build -ldflags -X` (e.g.
          github.com/gridwatch/terp/internal/branding.version). Empty
          skips stamping, in which case the binary reports itself as an
          unstamped dev build.
        type: string
        default: ''
      platforms:
        description: 'Space-separated GOOS/GOARCH pairs to build'
        type: string
        default: 'darwin/arm64 darwin/amd64 linux/amd64 linux/arm64'
      sibling-modules:
        description: 'Space-separated repo names to clone as sibling directories (go.mod replace targets)'
        type: string
        default: ''
      clone-registries:
        description: 'Clone the registries repo as a sibling directory'
        type: boolean
        default: false
      goreleaser:
        description: >-
          Build and publish with goreleaser from the repo's own
          `.goreleaser.yaml` instead of the `go build` loop below. The config
          then owns platforms, archives, ldflags and any Homebrew cask;
          `platforms` and `version-var` are ignored. The stamp is still
          verified here before anything is published.
        type: boolean
        default: false
    secrets:
      # The repo-access App halves, minted below into a per-run token for the
      # private gridwatch Go modules. Optional so forks and public callers run.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false
      # Contents + PRs write on gridwatch/homebrew-tap and scoop-bucket only,
      # read solely by the goreleaser path. Optional: `go build` never reads it.
      PACKAGE_REPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step's `if` can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    permissions:
      contents: write
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # `git describe` cannot see tags in a shallow clone.
          fetch-depth: 0

      # Per-run installation token for the private gridwatch Go modules.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout sibling repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLONE_REGISTRIES: ${{ inputs.clone-registries }}
          SIBLING_MODULES: ${{ inputs.sibling-modules }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling
          for mod in ${SIBLING_MODULES}; do
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/${mod}.git" "../${mod}"
          done
          if [ "${CLONE_REGISTRIES}" = "true" ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/registries.git" ../registries
          fi

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # GOPRIVATE keeps gridwatch modules off the public proxy and checksum db;
      # the rewrite gives git the token it needs to fetch them.
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "GOPRIVATE=github.com/gridwatch/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/gridwatch/".insteadOf "https://github.com/gridwatch/"

      # install-only: the stamp check sits between build and publish.
      #
      # see: https://github.com/goreleaser/goreleaser-action/releases/tag/v7.2.3
      - name: Install goreleaser
        if: ${{ inputs.goreleaser }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      # `build` writes the dist/ layout `release` will, without touching GitHub,
      # so the stamp can be checked before publishing.
      - name: Build with goreleaser
        if: ${{ inputs.goreleaser }}
        run: goreleaser build --clean

      - name: Build
        if: ${{ !inputs.goreleaser }}
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          MAIN_PACKAGE: ${{ inputs.main-package }}
          PLATFORMS: ${{ inputs.platforms }}
          VERSION_VAR: ${{ inputs.version-var }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          ldflags=''
          if [ -n "${VERSION_VAR}" ]; then
            ldflags="-X ${VERSION_VAR}=${VERSION}"
          fi

          for platform in ${PLATFORMS}; do
            goos="${platform%%/*}"
            goarch="${platform##*/}"
            out="dist/${BINARY_NAME}_${VERSION}_${goos}_${goarch}"

            echo "building ${goos}/${goarch}"
            # CGO off so every target cross-compiles with no host libc dependency.
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${out}" "${MAIN_PACKAGE}"
          done

          # Generated inside dist/ so the file records bare names for `shasum -c`.
          cd dist
          sha256sum ./* > "${BINARY_NAME}_${VERSION}_SHA256SUMS"

      - name: Verify the stamp
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          GORELEASER: ${{ inputs.goreleaser }}
          VERSION: ${{ github.ref_name }}
          VERSION_VAR: ${{ inputs.version-var }}
        run: |
          set -euo pipefail
          if [ "${GORELEASER}" = "true" ]; then
            # Grepping for the tag without its `v` matches the config's stamp.
            # Unconditional: a config that forgets to stamp fails the release.
            stamp="${VERSION#v}"
            checked=0
            while IFS= read -r binary; do
              if ! grep -qa -- "${stamp}" "${binary}"; then
                echo "::error::${stamp} is not present in ${binary}; the ldflags stamp did not take"
                exit 1
              fi
              checked=$((checked + 1))
            done < <(find dist -type f \( -name "${BINARY_NAME}" -o -name "${BINARY_NAME}.exe" \))
            if [ "${checked}" -eq 0 ]; then
              echo "::error::no binaries found to verify; the build produced nothing"
              exit 1
            fi
            echo "stamp verified in ${checked} binaries"
            exit 0
          fi

          if [ -z "${VERSION_VAR}" ]; then
            echo "no version-var configured; skipping stamp check"
            exit 0
          fi

          # Prove the stamp landed before publishing, across every artifact:
          # `platforms` is caller-overridable, so a hard-coded target lies.
          checked=0
          for binary in dist/"${BINARY_NAME}"_"${VERSION}"_*; do
            case "${binary}" in
              *_SHA256SUMS) continue ;;
            esac
            if ! grep -qa -- "${VERSION}" "${binary}"; then
              echo "::error::${VERSION} is not present in ${binary}; the ldflags stamp did not take"
              exit 1
            fi
            checked=$((checked + 1))
          done

          if [ "${checked}" -eq 0 ]; then
            echo "::error::no binaries found to verify; the build produced nothing"
            exit 1
          fi
          echo "stamp verified in ${checked} binaries"

      # `release --clean` rebuilds what `build` produced: goreleaser cannot
      # publish an existing dist/.
      - name: Publish with goreleaser
        if: ${{ inputs.goreleaser }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_REPO_TOKEN: ${{ secrets.PACKAGE_REPO_TOKEN }}
        run: goreleaser release --clean

      - name: Publish the release
        if: ${{ !inputs.goreleaser }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --verify-tag: refuse to invent a tag if the ref went away.
          gh release create "${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "${VERSION}" \
            --generate-notes \
            --verify-tag \
            dist/*
