---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Go Release

# Builds the binaries for a tagged commit and publishes them as a GitHub
# release. Triggered by the caller on a `v*` tag push, so the tag is the
# release: nothing here decides what to publish, it only reacts.

on:
  workflow_call:
    inputs:
      binary-name:
        description: 'Output binary name, also the release asset prefix'
        type: string
        required: true
      main-package:
        description: 'Package path to build (e.g. ./cmd/terp)'
        type: string
        required: true
      version-var:
        description: >-
          Fully qualified variable to stamp the tag into, as accepted by
          `go build -ldflags -X` (e.g.
          github.com/gridwatch/terp/internal/branding.version). Empty
          skips stamping, in which case the binary reports itself as an
          unstamped dev build.
        type: string
        default: ''
      platforms:
        description: 'Space-separated GOOS/GOARCH pairs to build'
        type: string
        default: 'darwin/arm64 darwin/amd64 linux/amd64 linux/arm64'
      sibling-modules:
        description: 'Space-separated repo names to clone as sibling directories (go.mod replace targets)'
        type: string
        default: ''
      clone-registries:
        description: 'Clone the registries repo as a sibling directory'
        type: boolean
        default: false
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # fetching the private gridwatch Go modules. Optional so public and
      # fork callers still run.
      REPO_ACCESS_APP_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here — where secrets are legal — to one non-secret boolean the
    # mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    permissions:
      # Creating the release and uploading its assets.
      contents: write
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The version stamp prefers an exact tag on HEAD, and
          # `git describe` cannot see tags in a shallow clone.
          fetch-depth: 0

      # Mints a per-run installation token for the private gridwatch Go
      # modules — about an hour's life, contents read, scoped to the
      # repo-access App's installation.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout sibling repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLONE_REGISTRIES: ${{ inputs.clone-registries }}
          SIBLING_MODULES: ${{ inputs.sibling-modules }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling
          for mod in ${SIBLING_MODULES}; do
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/${mod}.git" "../${mod}"
          done
          if [ "${CLONE_REGISTRIES}" = "true" ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/registries.git" ../registries
          fi

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # go.mod requirements for gridwatch modules resolve straight from GitHub:
      # GOPRIVATE keeps them away from the public proxy and checksum database,
      # which cannot see a private repo, and the rewrite gives git the token it
      # needs to fetch them.
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "GOPRIVATE=github.com/gridwatch/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/gridwatch/".insteadOf "https://github.com/gridwatch/"

      - name: Build
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          MAIN_PACKAGE: ${{ inputs.main-package }}
          PLATFORMS: ${{ inputs.platforms }}
          VERSION_VAR: ${{ inputs.version-var }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          ldflags=''
          if [ -n "${VERSION_VAR}" ]; then
            ldflags="-X ${VERSION_VAR}=${VERSION}"
          fi

          for platform in ${PLATFORMS}; do
            goos="${platform%%/*}"
            goarch="${platform##*/}"
            out="dist/${BINARY_NAME}_${VERSION}_${goos}_${goarch}"

            echo "building ${goos}/${goarch}"
            # CGO off so every target cross-compiles from this runner and
            # the result carries no host libc dependency.
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${out}" "${MAIN_PACKAGE}"
          done

          # Checksums are generated from inside dist/ so the file records
          # bare names, which is what `shasum -c` expects to find beside it.
          cd dist
          sha256sum ./* > "${BINARY_NAME}_${VERSION}_SHA256SUMS"

      - name: Verify the stamp
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          VERSION: ${{ github.ref_name }}
          VERSION_VAR: ${{ inputs.version-var }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_VAR}" ]; then
            echo "no version-var configured; skipping stamp check"
            exit 0
          fi

          # A silently unstamped release is the failure this whole input
          # exists to prevent, so prove it landed before publishing.
          #
          # Check every artifact rather than one assumed target: the
          # caller can override `platforms`, and a check hard-coded to
          # linux/amd64 would fail a release that never asked for it —
          # while also saying nothing about the platforms it did build.
          checked=0
          for binary in dist/"${BINARY_NAME}"_"${VERSION}"_*; do
            case "${binary}" in
              *_SHA256SUMS) continue ;;
            esac
            if ! grep -qa -- "${VERSION}" "${binary}"; then
              echo "::error::${VERSION} is not present in ${binary}; the ldflags stamp did not take"
              exit 1
            fi
            checked=$((checked + 1))
          done

          if [ "${checked}" -eq 0 ]; then
            echo "::error::no binaries found to verify; the build produced nothing"
            exit 1
          fi
          echo "stamp verified in ${checked} binaries"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --verify-tag: refuse to invent a tag if the ref went away
          # between the push and this job.
          gh release create "${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "${VERSION}" \
            --generate-notes \
            --verify-tag \
            dist/*
