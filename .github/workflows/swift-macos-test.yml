---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Swift macOS App Test

on:
  workflow_call:
    inputs:
      project:
        description: 'Xcode project file'
        type: string
        required: true
      scheme:
        description: 'Xcode scheme to test'
        type: string
        required: true
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # private repository reads. Optional so public and fork callers run.
      REPO_ACCESS_APP_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here — where secrets are legal — to one non-secret boolean the
    # mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Mints a per-run installation token for the private repository
      # reads below — about an hour's life, contents read.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout sibling repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/GridwatchKit.git" ../GridwatchKit
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling

      # Deliberately NO open-source-toolchain install here: forcing TOOLCHAINS=swift makes
      # SPM manifest compilation fail on the runner (posix_spawn linker errors) — the runner
      # Xcode's own bundled Swift is the standard, working toolchain for xcodebuild.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          install_dir="$(mktemp -d)"
          zip="${install_dir}/xcodegen.zip"
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${zip}"
          echo "${XCODEGEN_SHA256}  ${zip}" | shasum -a 256 -c -
          unzip -q "${zip}" -d "${install_dir}"
          echo "${install_dir}/xcodegen/bin" >> "${GITHUB_PATH}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          # Code signing is disabled for CI: a test run needs no signed product, and an app
          # with entitlements (iCloud, etc.) would otherwise demand a provisioning profile
          # the runner cannot mint non-interactively.
          xcodebuild -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test
