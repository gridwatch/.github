---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: golangci-lint

on:
  workflow_call:
    inputs:
      clone-registries:
        description: 'Clone the registries repo (server-loaded YAML) as a sibling directory'
        type: boolean
        default: false
      setup-command:
        description: 'Shell command to run after checkout, before linting (e.g. copy registry data for go:embed)'
        type: string
        default: ''
      sibling-modules:
        description: 'Space-separated repo names to clone as sibling directories (go.mod replace targets)'
        type: string
        default: ''
      working-directory:
        description: >-
          Directory holding go.mod, when the module is not at the repository
          root (e.g. `tools`). The tooling checkout stays beside the repository
          either way, so the config path below is anchored to the workspace
          rather than walked back relatively.
        type: string
        default: '.'
    secrets:
      # Optional so public repos and fork pull requests, which receive no
      # secrets, still run; only private sibling checkouts need the token.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The shared golangci config lives in the public `.github` repository, so
      # this clone needs no credentials and works for public and fork callers.
      - name: Checkout lint config
        run: git clone --depth 1 --branch main --single-branch https://github.com/gridwatch/.github.git ../fleet-config

      # Mints a per-run installation token for the private gridwatch Go modules.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout sibling repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLONE_REGISTRIES: ${{ inputs.clone-registries }}
          SIBLING_MODULES: ${{ inputs.sibling-modules }}
        run: |
          # All private; skipped without a token. A public caller has no
          # private siblings, and its config already came from the clone above.
          if [ -z "${GH_TOKEN}" ]; then
            echo "no repo-access App token; skipping private sibling checkouts"
            exit 0
          fi
          for mod in ${SIBLING_MODULES}; do
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/${mod}.git" "../${mod}"
          done
          if [ "${CLONE_REGISTRIES}" = "true" ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/registries.git" ../registries
          fi

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod

      # GOPRIVATE keeps gridwatch modules off the public proxy and checksum
      # database; the rewrite gives git the token. Skipped without one, or an
      # empty credential turns a public module's anonymous clone into a 401.
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "no repo-access App token; leaving module resolution on the public proxy"
            exit 0
          fi
          echo "GOPRIVATE=github.com/gridwatch/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/gridwatch/".insteadOf "https://github.com/gridwatch/"

      # Via the environment, so the command's text is never parsed as script.
      # `-e` is restated: the default shell applies it to the outer script only,
      # so a `cmd1; cmd2` command would otherwise continue past a failing cmd1.
      - name: Run setup command
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -eo pipefail -c "$SETUP_COMMAND"

      # `../fleet-config` is relative to the checkout root, so --config is
      # anchored to github.workspace — a relative path breaks under any other
      # working-directory.
      #
      # see: https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          args: --config ${{ github.workspace }}/../fleet-config/golangci.yml ./...
          version: "v2.13.1"
          working-directory: ${{ inputs.working-directory }}

      # golangci-lint reads the code; govulncheck reads what the code calls.
      # Both run locally in `task lint-go`, so CI must run both too.
      #
      # see: https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck
      - name: Run govulncheck
        working-directory: ${{ inputs.working-directory }}
        env:
          # `go run` builds govulncheck itself, so a pin needing a newer Go than the
          # caller's go directive fetches that toolchain here instead of failing to build.
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
