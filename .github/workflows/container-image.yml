---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Build and Push Container Image

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name without registry prefix'
        type: string
        required: true
      version:
        description: 'Image version tag (from git tag or dispatch input)'
        type: string
        required: true
      dhi-login:
        description: 'Log in to dhi.io for base image access during build'
        type: boolean
        default: false
      sbom:
        description: >-
          Generate an SPDX SBOM and fail the build on critical
          vulnerabilities. Attaching the SBOM to the image as an
          attestation requires either cosign or github-attestations
        type: boolean
        default: false
      cosign:
        description: 'Sign image with Cosign, and attest the SBOM when sbom is also set'
        type: boolean
        default: false
      github-attestations:
        description: >-
          Also publish SBOM and build-provenance attestations to GitHub.
          Requires a plan where the attestations API is available for
          private org repos, otherwise every run fails these steps
        type: boolean
        default: false
      ghcr:
        description: >-
          Also push the image to GHCR, so it can be pulled without an
          Azure account. The same build is tagged twice and pushed to
          both registries, so the two carry an identical digest. Off by
          default: a package appearing in the org's registry is a
          decision, not a side effect of a workflow change
        type: boolean
        default: false
      vendor-go-modules:
        description: >-
          Run `go mod vendor` on the runner before the build, so the
          Containerfile builds with -mod=vendor and no credential ever
          enters the container build.
        type: boolean
        default: false
      composer-auth:
        description: >-
          Feed the minted App token to Composer as a github-oauth
          credential, wrapped into a COMPOSER_AUTH JSON blob and exposed
          to `docker build` as a BuildKit secret (id=composer_auth) —
          NOT a build-arg, which would land in image metadata and the
          build cache. For consumers whose composer.json declares
          private gridwatch VCS packages.
        type: boolean
        default: false
    secrets:
      # The registry this builds into, set on each container repo by
      # infrastructure-platform.
      ACR_NAME:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      DHI_USERNAME:
        required: false
      DHI_PASSWORD:
        required: false
      # The repo-access App halves, minted ON THE RUNNER. The token reaches the
      # container build only as the BuildKit composer_auth secret.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    # ACR_NAME arrives as a secret rather than a literal: infrastructure-platform
    # owns the registry, and a hardcoded name is a second source of truth that a
    # rename would silently strand.
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io
      # GHCR rejects an uppercase path; interpolated rather than hardcoded so a
      # fork pushes to its own namespace.
      GHCR_LOGIN_SERVER: ghcr.io
      GHCR_OWNER: ${{ github.repository_owner }}
      # A step `if` cannot read the secrets context, so the two App halves are
      # reduced here to one non-secret boolean the mint step can test.
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: inputs.vendor-go-modules
        with:
          go-version-file: go.mod

      # Mints a per-run installation token for the private gridwatch Go modules.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ (inputs.vendor-go-modules || inputs.composer-auth) && env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Vendoring happens on the runner, where the credential lives; the build
      # below gets a context needing no network and no token.
      - name: Vendor Go modules
        if: inputs.vendor-go-modules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::vendor-go-modules needs the repo-access App to fetch the private gridwatch modules"
            exit 1
          fi
          export GOPRIVATE="github.com/gridwatch/*"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/gridwatch/".insteadOf "https://github.com/gridwatch/"
          # The trap scrubs the token-bearing rewrite however the step ends.
          trap 'git config --global --remove-section url."https://x-access-token:${GH_TOKEN}@github.com/gridwatch/" 2>/dev/null || true' EXIT
          go mod vendor

      - name: Set version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            *$'\n'*|*$'\r'*)
              echo "Invalid version: must not contain newlines" >&2
              exit 1
              ;;
          esac
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      # see: https://github.com/Azure/login/releases/tag/v3.0.1
      - name: Log in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      # GITHUB_TOKEN carries `packages: write`, so GHCR needs no credential of
      # its own, unlike ACR's OIDC federated identity.
      - name: Log in to GHCR
        if: inputs.ghcr
        run: printf '%s' "$GHCR_TOKEN" | docker login "$GHCR_LOGIN_SERVER" -u "$GHCR_USERNAME" --password-stdin
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to dhi.io
        if: inputs.dhi-login
        run: printf '%s' "$DHI_PASSWORD" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_PASSWORD: ${{ secrets.DHI_PASSWORD }}

      - name: Build image
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMPOSER_AUTH_TOKEN: ${{ inputs.composer-auth && steps.app-token.outputs.token || '' }}
          # Needed here as well as on the push below: without it the second
          # `-t` is missing and the push fails on a tag never applied.
          GHCR: ${{ inputs.ghcr }}
        run: |
          # Always pass --secret so a Containerfile can unconditionally mount
          # id=composer_auth; with no token the file is empty and its guard skips.
          COMPOSER_AUTH_FILE=$(mktemp)
          trap 'rm -f "$COMPOSER_AUTH_FILE"' EXIT
          if [ -n "$COMPOSER_AUTH_TOKEN" ]; then
            jq -nc '{"github-oauth":{"github.com":env.COMPOSER_AUTH_TOKEN}}' > "$COMPOSER_AUTH_FILE"
          fi
          unset COMPOSER_AUTH_TOKEN
          # One build tagged for both registries: two builds would give two
          # digests, and every signature and SBOM below is bound to a digest.
          TAGS="-t $ACR_LOGIN_SERVER/$IMAGE_NAME:$VERSION"
          if [ "$GHCR" = "true" ]; then
            TAGS="$TAGS -t $GHCR_LOGIN_SERVER/$GHCR_OWNER/$IMAGE_NAME:$VERSION"
          fi
          # shellcheck disable=SC2086 # TAGS is a deliberately split flag list
          DOCKER_BUILDKIT=1 docker build -f Containerfile \
            --build-arg VERSION="$VERSION" \
            --secret id=composer_auth,src="$COMPOSER_AUTH_FILE" \
            $TAGS .

      - name: Push image
        id: push
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          GHCR: ${{ inputs.ghcr }}
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$VERSION"
          docker push "$IMAGE"
          # Read the ACR digest specifically: with two tags, `RepoDigests[0]` is
          # whichever registry answered first, so blind indexing follows push order.
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE" \
            | grep "^$ACR_LOGIN_SERVER/$IMAGE_NAME@" | head -1 | cut -d@ -f2)
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve the pushed digest for $IMAGE" >&2
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

          if [ "$GHCR" = "true" ]; then
            GHCR_IMAGE="$GHCR_LOGIN_SERVER/$GHCR_OWNER/$IMAGE_NAME:$VERSION"
            docker push "$GHCR_IMAGE"
            echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      # see: https://github.com/anchore/sbom-action/releases/tag/v0.24.0
      - name: Generate SBOM
        if: inputs.sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ steps.push.outputs.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json

      # see: https://github.com/anchore/scan-action/releases/tag/v7.4.0
      - name: Scan SBOM for vulnerabilities
        if: inputs.sbom
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical

      # GitHub's attestation API is plan-gated for private org repos, so these
      # stay off by default. Never add `continue-on-error`: it reported success
      # while failing, which is how a broken supply-chain step hides.
      # see: https://github.com/actions/attest/releases/tag/v4.2.2
      - name: Attest SBOM (GitHub)
        if: inputs.sbom && inputs['github-attestations']
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.DIGEST }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: sbom.spdx.json
          push-to-registry: true

      # see: https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
      - name: Attest build provenance (GitHub)
        if: inputs.github-attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.push.outputs.DIGEST }}
          push-to-registry: true

      # Cosign keyless signing works on any plan. No `continue-on-error`: a
      # signature that silently fails to publish is worse than a red build.
      # see: https://github.com/sigstore/cosign-installer/releases/tag/v4.1.2
      - name: Install Cosign
        if: inputs.cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Signed per registry: a signature is an OCI referrer in the registry it
      # was pushed to, so signing ACR leaves the GHCR copy unsigned.
      - name: Sign image
        if: inputs.cosign
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          DIGEST: ${{ steps.push.outputs.DIGEST }}
          GHCR: ${{ inputs.ghcr }}
        run: |
          cosign sign --yes "$ACR_LOGIN_SERVER/$IMAGE_NAME@$DIGEST"
          if [ "$GHCR" = "true" ]; then
            cosign sign --yes "$GHCR_LOGIN_SERVER/$GHCR_OWNER/$IMAGE_NAME@$DIGEST"
          fi

      # Attaches the SBOM to the digest as a referrer, recoverable with
      # `cosign verify-attestation --type spdxjson`.
      - name: Attest SBOM (Cosign)
        if: inputs.sbom && inputs.cosign
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          DIGEST: ${{ steps.push.outputs.DIGEST }}
          GHCR: ${{ inputs.ghcr }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME@$DIGEST"
          # A referrer lives in one registry, so the GHCR copy needs its own.
          if [ "$GHCR" = "true" ]; then
            cosign attest --yes \
              --predicate sbom.spdx.json \
              --type spdxjson \
              "$GHCR_LOGIN_SERVER/$GHCR_OWNER/$IMAGE_NAME@$DIGEST"
          fi
