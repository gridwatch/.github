name: Markdown Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: actions/checkout@v7.0.0

      # see: https://github.com/actions/setup-node/releases/tag/v6.3.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Run markdownlint-cli2
        run: npx -y markdownlint-cli2@0.18.1 "**/*.md" "#node_modules"
