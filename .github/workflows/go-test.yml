---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Go Test

on:
  workflow_call:
    inputs:
      clone-assets:
        description: 'Clone the assets repo (media prompts) as a sibling directory'
        type: boolean
        default: false
      clone-registries:
        description: 'Clone the registries repo (server-loaded YAML) as a sibling directory'
        type: boolean
        default: false
      setup-command:
        description: 'Shell command to run after checkout, before tests (e.g. copy registry data for go:embed)'
        type: string
        default: ''
      sibling-modules:
        description: 'Space-separated repo names to clone as sibling directories (go.mod replace targets)'
        type: string
        default: ''
      coverage-threshold:
        description: 'Fail when total statement coverage is below this percent. 0 disables the gate.'
        type: number
        default: 0
      postgres-image:
        description: 'Image for a Postgres started before the tests. Empty means no database.'
        type: string
        default: ''
      database-url-env:
        description: 'Variable the connection URL is exported as (e.g. CROSSBAND_TEST_DATABASE_URL).'
        type: string
        default: ''
      working-directory:
        description: 'Directory holding go.mod, when the module is not at the repository root (e.g. `tools`).'
        type: string
        default: '.'
    secrets:
      # Optional so forks and public repos still run — a fork PR receives no
      # secrets. Every step needing the token is guarded on it being set.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

# SHA for pushes, ref for pull requests, so a burst of pushes cannot leave a
# branch tip holding `cancelled` checks; see infrastructure-github AGENTS.md
# (Workflow concurrency). The caller's workflow name keeps two callers in one
# repo apart, and the event keeps the nightly cache warm from cancelling a
# push run on the same commit.
concurrency:
  group: ${{ github.repository }}-go-test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step's `if` can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
      # The caller's nightly schedule warms the cache instead of testing; see
      # the save step at the end for why it is the only run that writes one.
      WARM_CACHE: ${{ github.event_name == 'schedule' }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # goroutineleak.go lives in the public `.github` repository, so this clone
      # needs no credentials and works for public and fork callers. It shares a
      # trust root with this workflow, which is read from the same `.github@main`,
      # and the tests it runs see the module token either way, so pinning adds nothing.
      - name: Checkout test harness
        run: git clone --depth 1 --branch main --single-branch https://github.com/gridwatch/.github.git ../fleet-config

      # The token reaches only what this run clones or fetches: tooling, the
      # caller's siblings, and every gridwatch module go.mod requires. A
      # pruned module graph lists every module a build needs, so go.mod is
      # the whole set; the module's own path is left out.
      - name: List private repositories
        id: private-repos
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          CLONE_ASSETS: ${{ inputs.clone-assets }}
          CLONE_REGISTRIES: ${{ inputs.clone-registries }}
          SIBLING_MODULES: ${{ inputs.sibling-modules }}
        run: |
          set -euo pipefail
          {
            echo tooling
            for mod in ${SIBLING_MODULES}; do echo "${mod}"; done
            if [ "${CLONE_ASSETS}" = "true" ]; then echo assets; fi
            if [ "${CLONE_REGISTRIES}" = "true" ]; then echo registries; fi
            grep -v '^module ' go.mod | grep -oE 'github\.com/gridwatch/[A-Za-z0-9._-]+' | sed 's|.*/||' || true
          } | sort -u | paste -sd, - | sed 's/^/list=/' >> "$GITHUB_OUTPUT"

      # Per-run installation token for the private gridwatch Go modules.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.private-repos.outputs.list }}
          permission-contents: read

      - name: Checkout sibling repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLONE_ASSETS: ${{ inputs.clone-assets }}
          CLONE_REGISTRIES: ${{ inputs.clone-registries }}
          SIBLING_MODULES: ${{ inputs.sibling-modules }}
        run: |
          # All private clones, so skipped without a token — a caller's
          # setup-command may still expect these checkouts to exist.
          if [ -z "${GH_TOKEN}" ]; then
            echo "no repo-access App token; skipping private sibling checkouts"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling
          for mod in ${SIBLING_MODULES}; do
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/${mod}.git" "../${mod}"
          done
          if [ "${CLONE_ASSETS}" = "true" ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/assets.git" ../assets
          fi
          if [ "${CLONE_REGISTRIES}" = "true" ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/registries.git" ../registries
          fi

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      # setup-go's own cache saves on every run, pull requests included; the
      # restore below replaces it.
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: false

      # Restore-only. Saved keys carry a run ID suffix, so the primary key never
      # matches and the newest nightly for this go.sum wins, then any older one.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-

      # GOPRIVATE keeps gridwatch modules off the public proxy and checksum db.
      # Skipped without a token: the rewrite would break anonymous public fetches.
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "no repo-access App token; leaving module resolution on the public proxy"
            exit 0
          fi
          echo "GOPRIVATE=github.com/gridwatch/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/gridwatch/".insteadOf "https://github.com/gridwatch/"

      # Via the environment so the command text cannot be parsed as script.
      # `-e` is restated: the default shell applies it to the outer script only.
      - name: Run setup command
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -eo pipefail -c "$SETUP_COMMAND"

      # `docker run` rather than `services:`, which cannot be made conditional.
      # Image is an input: stock `postgres` fails a `vector`/`postgis` migration.
      - name: Start Postgres
        if: inputs.postgres-image != '' && env.WARM_CACHE != 'true'
        env:
          POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        run: |
          set -euo pipefail
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            "${POSTGRES_IMAGE}"
          # pg_isready in the container: a host port check does not prove ready.
          for _ in $(seq 60); do
            if docker exec ci-postgres pg_isready -U test -q; then exit 0; fi
            sleep 1
          done
          echo "::error::Postgres never became ready"
          docker logs ci-postgres
          exit 1

      # Repo-chosen variable name: these suites skip when it is unset, so a
      # mismatch silently skips every database test and still reports passing.
      # goroutineleak.go wraps go test with the leak check `task test` runs locally.
      - name: Run tests
        if: env.WARM_CACHE != 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          DATABASE_URL_ENV: ${{ inputs.database-url-env }}
          POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL_ENV}" ] && [ -z "${POSTGRES_IMAGE}" ]; then
            echo "::error::database-url-env is set but postgres-image is empty"
            exit 1
          fi
          if [ -n "${DATABASE_URL_ENV}" ]; then
            export "${DATABASE_URL_ENV}=postgres://test:test@localhost:5432/test?sslmode=disable"
          fi
          go run "${GITHUB_WORKSPACE}/../fleet-config/goroutineleak.go" -race -count=1 -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        if: inputs.coverage-threshold > 0 && env.WARM_CACHE != 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          # pipefail: without it a failing `go tool cover` is masked by `tr`.
          set -euo pipefail

          total="$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }' | tr -d '%')"
          if [ -z "${total}" ]; then
            echo "::error::could not read a coverage total from coverage.out"
            exit 1
          fi
          echo "total statement coverage: ${total}% (threshold ${COVERAGE_THRESHOLD}%)"

          # awk, not $(( )): shell arithmetic is integer-only and errors on a
          # fractional operand rather than truncating it.
          awk -v got="${total}" -v want="${COVERAGE_THRESHOLD}" \
            'BEGIN { if (got + 0 < want + 0) { exit 1 } }' \
            || {
              echo "::error::coverage ${total}% is below the ${COVERAGE_THRESHOLD}% threshold"
              exit 1
            }

      # Compiles every test binary with the flags above and runs none of them,
      # which fills the build cache without needing Postgres or a green suite.
      # The leak wrapper is left out: its overlay differs per run, so nothing
      # it compiles could be reused anyway.
      - name: Warm build cache
        if: env.WARM_CACHE == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: go test -race -count=1 -exec /bin/true ./...

      # The one cache writer: the nightly run on main. A pull request only
      # restores, so it can neither poison what main reads nor spend the
      # repository's cache quota on branch-scoped copies. A public repository
      # saves nothing once the App token was minted, or private module source
      # would be restorable by any fork's pull request.
      # see: https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Save Go cache
        if: env.WARM_CACHE == 'true' && (github.event.repository.private || steps.app-token.outcome != 'success')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}-${{ github.run_id }}
