---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.

name: Super-Linter

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
  # A run that fails at workflow load has no jobs and cannot be re-run, so
  # without this the only way to retry after such a failure is a new push.
  # It is also the only way to exercise this workflow on demand: the apply
  # that writes it queues no run, so without a dispatch its first execution
  # is whenever somebody next pushes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superlinter:
    name: superlinter
    uses: gridwatch/.github/.github/workflows/superlinter-prose.yml@5365ba777c7ec00d70e385989818525c81d5f9ba  # v20260923-1
    with:
      copy-yamllint-config: true
      filter-regex-exclude: '(Taskfile\.yml|tooling/|_vendor/|\.specify/|specs/|\.claude/)'
