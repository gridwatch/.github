---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

# Posts data-feeds CSVs and schema.json to the CAPSTONE Craft webhook, which
# stages them to Azure Blob from inside the VNet (GHA cannot reach it).
#
# Consumers never write this call by hand: templates/callers/capstone-sync.tftpl.yml
# renders it into each repo, and that file is the authoritative shape.

name: CAPSTONE Data Feeds Sync

on:
  workflow_call:
    inputs:
      webhook-url:
        description: |
          Full URL of the Craft feeds-sync webhook (e.g.
          https://capstone.frontierdefensetech.com/feeds/sync). Rendered
          into the consumer repo by infrastructure-github from a Terraform
          variable; mirrors local.capstone_hostname from
          infrastructure-capstone.
        type: string
        required: true
      yaml-collections:
        description: |
          Space-separated top-level directories this repo ships beside its root CSVs, each
          packaged whole (sim-data sends 'commanders qrf', world-data 'fitness'). A name is
          the directory a collection path starts at, not the collection itself: 12b derives
          qrf/cards/ from qrf-card.schema.json and fitness/charts/ from
          fitness-chart.schema.json, so the names are qrf and fitness. Empty packages only the
          root CSVs and schemas, which is every repo that carries no YAML collection.
        type: string
        default: ''
      site:
        description: |
          Craft site handle the sync imports into (e.g. websiteData), as the status route
          names it. Required whenever rebuild-sites is set, and must then equal the site query
          parameter of webhook-url; unused otherwise.
        type: string
        default: ''
      rebuild-sites:
        description: |
          Comma-separated repository names whose deploy.yml is dispatched on main once the
          import this sync queued is done (e.g. 'fdt-website'): its import job, and the Feed Me
          sequence when the sync response names one. A webhook-url that carries feedMe=queue
          must get a sequence back, or nothing is rebuilt. Empty, the default, posts the feed
          and stops: nothing is waited for and no site is rebuilt.
        type: string
        default: ''
      wait-seconds:
        description: |
          How long to wait for the import before failing the run. For an import job alone it
          is a fixed limit. When a Feed Me sequence is followed it is a no-progress limit: it
          starts again each time the sequence has fewer feeds left. Nothing is rebuilt on a
          timeout; the sites' daily build is the fallback.
        type: number
        default: 600
    secrets:
      CF_ACCESS_CLIENT_ID:
        description: 'Cloudflare Access service-token client ID for the CAPSTONE feeds-sync webhook.'
        required: true
      CF_ACCESS_CLIENT_SECRET:
        description: 'Cloudflare Access service-token client secret for the CAPSTONE feeds-sync webhook.'
        required: true
      REBUILD_APP_CLIENT_ID:
        description: 'Client ID of the GitHub App that dispatches the dependent sites. Needed only with rebuild-sites.'
        required: false
      REBUILD_APP_PRIVATE_KEY:
        description: 'Private key of the GitHub App that dispatches the dependent sites. Needed only with rebuild-sites.'
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: sync
    runs-on: ubuntu-26.04
    steps:
      # Each run uploads the whole tree of the commit that triggered it, to production. A run is
      # refused before anything is checked out or posted when either rule holds, on a first
      # attempt and on a re-run alike:
      #
      # 1. It was started from any ref but the default branch: its data has not merged.
      # 2. Its commit is not the default branch's tip, and the tip's tree differs in something a
      #    sync sends: it would put an older tree over newer data. GitHub does not create runs in
      #    commit order, so in a concurrency group the first attempt for an ancestor can queue
      #    after the tip's run, displace it as the pending run, and post last.
      #
      # A commit behind the tip still syncs when the two trees are the same to a sync: the tip is
      # ahead of it and changed no root `*.csv` or `*.schema.json` entry, nothing under a
      # `yaml-collections` directory, and not the caller file, whose inputs must match the tree.
      # That is a later push that started no sync of its own, such as one to the docs.
      #
      # Rule 2 cannot tell whether the newer commit's own sync ran, is queued or was displaced,
      # so it fails red in each case. That is deliberate: a red run that names the remedy beats
      # stale data nobody was told about.
      #
      # It narrows the gap and does not close it. A run that was the tip when it passed here can
      # still be posting when a newer commit's sync is displaced by an older one; that older run
      # is refused, so production keeps this run's tree, one commit behind, until someone starts
      # the fresh sync the refusal names. Closing it needs CAPSTONE to judge the commit at intake.
      #
      # The run is refused, never pointed at a newer tree: a run keeps the caller file and
      # inputs of its own commit, and a collection missing from an old `yaml-collections` is
      # one CAPSTONE deletes. The tree and the inputs must come from one commit.
      #
      # So every run, a first attempt included, depends on one API call (the tip lookup) and
      # fails closed without it. That is accepted: the checkout below needs GitHub too, a
      # refused run has sent nothing, and re-running it passes once the API answers. Both calls
      # need `contents: read` only, and run before the checkout because that persists no
      # credentials.
      - name: Refuse a stale or off-branch sync
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
          YAML_COLLECTIONS: ${{ inputs.yaml-collections }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo "::error::This event names no default branch, so the tree to sync is unknown. Nothing was sent."
            exit 1
          fi
          if [[ "${RUN_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::This run was started from ${RUN_REF}. A sync only ever sends ${DEFAULT_BRANCH}, the default branch. Nothing was sent."
            exit 1
          fi
          attempt="(attempt ${RUN_ATTEMPT:-unknown})"
          fresh="gh workflow run capstone-sync.yml --ref ${DEFAULT_BRANCH}"
          # `heads/` keeps a tag of the same name out of it.
          tip=$(gh api "repos/${REPOSITORY}/commits/heads/${DEFAULT_BRANCH}" --jq .sha) || tip=''
          if [[ ! "${tip}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::Could not read the tip of ${DEFAULT_BRANCH}, so this run ${attempt} cannot be shown to be current. Nothing was sent. Re-run it, or start a new sync from ${DEFAULT_BRANCH}: ${fresh}"
            exit 1
          fi
          if [[ "${tip}" == "${TRIGGER_SHA}" ]]; then
            echo "Syncing ${DEFAULT_BRANCH} at ${TRIGGER_SHA:0:7}, its tip ${attempt}."
            exit 0
          fi
          # What the tip has that this commit lacks. A rename counts under both names: the old
          # one may be a feed file the tip no longer has.
          comparison=$(gh api "repos/${REPOSITORY}/compare/${TRIGGER_SHA}...${tip}" \
            --jq '{status: .status, count: (.files | length), names: [.files[] | .filename, (.previous_filename // empty)]}') || comparison=''
          # One word, never a file name: a name is repository content and must not reach a
          # workflow command. A collection name is matched as Package feeds reads it, split on
          # whitespace; one that is not a plain path cannot be matched and counts as a change.
          # The list stops at 300 files, so a full one may hide a feed file.
          verdict=$(jq -r --arg collections "${YAML_COLLECTIONS}" '
            def plain: test("^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$");
            ($collections | [splits("[ \t\r\n]+")] | map(select(length > 0) | sub("^(\\./)+"; "") | sub("/+$"; ""))) as $dirs
            | if type != "object" or (.status | type) != "string" then "unreadable"
              elif .status == "behind" or .status == "diverged" or .status == "identical" then .status
              elif .status != "ahead" then "unreadable"
              elif (.count | type) != "number" or (.names | type) != "array" then "unreadable"
              elif (.names | all(type == "string" and length > 0) | not) then "unreadable"
              elif .count >= 300 then "truncated"
              elif ($dirs | all(plain) | not) then "collections"
              elif any(.names[]; . == ".github/workflows/capstone-sync.yml") then "caller"
              elif any(.names[]; split("/")[0] | test("\\.(csv|schema\\.json)$")) then "root"
              elif any(.names[]; . as $name | any($dirs[]; . as $dir | $name | startswith($dir + "/"))) then "collection"
              else "same"
              end' <<< "${comparison}" 2>/dev/null) || verdict=''
          newer="but ${DEFAULT_BRANCH} is now at ${tip:0:7} and"
          remedy="an older tree over newer data. Nothing was sent. If the newer commit's own sync did not run or was displaced, start one from ${DEFAULT_BRANCH}: ${fresh}"
          case "${verdict}" in
            same)
              echo "::notice::Syncing ${TRIGGER_SHA:0:7} ${attempt}. ${DEFAULT_BRANCH} is now at ${tip:0:7}, which changed nothing a sync sends."
              ;;
            behind | diverged | identical)
              echo "::error::This run ${attempt} would send ${TRIGGER_SHA:0:7}, which ${DEFAULT_BRANCH} at ${tip:0:7} does not build on (the comparison says ${verdict}): the branch was rewritten, or this commit was never on it. Nothing was sent. Start a new sync from ${DEFAULT_BRANCH}: ${fresh}"
              exit 1
              ;;
            root)
              echo "::error::This run ${attempt} would send ${TRIGGER_SHA:0:7}, ${newer} a newer commit changed a root CSV or schema: ${remedy}"
              exit 1
              ;;
            collection)
              echo "::error::This run ${attempt} would send ${TRIGGER_SHA:0:7}, ${newer} a newer commit changed a yaml-collections directory: ${remedy}"
              exit 1
              ;;
            caller)
              echo "::error::This run ${attempt} would send ${TRIGGER_SHA:0:7}, ${newer} a newer commit changed capstone-sync.yml, so this run's inputs are old: ${remedy}"
              exit 1
              ;;
            truncated)
              echo "::error::This run ${attempt} would send ${TRIGGER_SHA:0:7}, ${newer} differs in 300 files or more, too many to list, so a feed change cannot be ruled out: ${remedy}"
              exit 1
              ;;
            collections)
              echo "::error::This run ${attempt} would send ${TRIGGER_SHA:0:7}, ${newer} yaml-collections holds a name that cannot be matched against the changed files, so a feed change cannot be ruled out: ${remedy}"
              exit 1
              ;;
            *)
              echo "::error::Could not compare ${TRIGGER_SHA:0:7} with ${tip:0:7}, the tip of ${DEFAULT_BRANCH}, so this run ${attempt} cannot be shown to send current data. Nothing was sent. Re-run it, or start a new sync from ${DEFAULT_BRANCH}: ${fresh}"
              exit 1
              ;;
          esac

      # Before anything is posted: a sync that could not wait for its own import must not run.
      - name: Check rebuild inputs
        if: ${{ inputs.rebuild-sites != '' }}
        env:
          SITE: ${{ inputs.site }}
          SITES: ${{ inputs.rebuild-sites }}
          WAIT_SECONDS: ${{ inputs.wait-seconds }}
          WEBHOOK_URL: ${{ inputs.webhook-url }}
          REBUILD_APP_CLIENT_ID: ${{ secrets.REBUILD_APP_CLIENT_ID }}
          REBUILD_APP_PRIVATE_KEY: ${{ secrets.REBUILD_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SITE}" ]]; then
            echo "::error::rebuild-sites needs site"
            exit 1
          fi
          # Both end up in a URL or a --repo argument.
          if [[ ! "${SITE}" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::site must be a Craft site handle (letters, digits, underscores)."
            exit 1
          fi
          # The sync imports into the site webhook-url names and the wait polls the site input.
          # They must be one site: asked about another site's queue, CAPSTONE answers `done`.
          # The last `site` wins, as it does when Craft reads the query.
          url_site=''
          if [[ "${WEBHOOK_URL}" == *\?* ]]; then
            query="${WEBHOOK_URL#*\?}"
            IFS='&' read -r -a params <<< "${query%%#*}"
            for param in "${params[@]}"; do
              if [[ "${param}" == site=* ]]; then
                url_site="${param#site=}"
              fi
            done
          fi
          if [[ -z "${url_site}" ]]; then
            echo "::error::rebuild-sites needs a site query parameter in webhook-url: a sync that names no site queues no import."
            exit 1
          fi
          if [[ "${url_site}" != "${SITE}" ]]; then
            echo "::error::site is '${SITE}', but webhook-url syncs into another site. They must name the same Craft site."
            exit 1
          fi
          # Only tested for presence, never printed. Without them the run would post the feed and
          # wait for the import before failing at the token mint.
          if [[ -z "${REBUILD_APP_CLIENT_ID}" ]]; then
            echo "::error::rebuild-sites needs the REBUILD_APP_CLIENT_ID secret, which is empty or not passed."
            exit 1
          fi
          if [[ -z "${REBUILD_APP_PRIVATE_KEY}" ]]; then
            echo "::error::rebuild-sites needs the REBUILD_APP_PRIVATE_KEY secret, which is empty or not passed."
            exit 1
          fi
          if [[ ! "${SITES}" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then
            echo "::error::rebuild-sites must be repository names separated by commas, without spaces."
            exit 1
          fi
          if [[ ! "${WAIT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "::error::wait-seconds must be a whole number of seconds."
            exit 1
          fi

      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Package feeds
        # `shell: bash` is explicit: this script needs `shopt -s nullglob`,
        # bash arrays and `[[ ... ]]`.
        shell: bash
        env:
          YAML_COLLECTIONS: ${{ inputs.yaml-collections }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.csv *.schema.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No *.csv or *.schema.json files found at repo root — nothing to sync."
            exit 1
          fi
          # Whole directories, not a glob of files: the importer treats a collection file that is
          # absent from the payload as deleted, so a partial directory silently drops entries.
          for collection in ${YAML_COLLECTIONS}; do
            if [[ ! -d "${collection}" ]]; then
              echo "::error::yaml-collections names '${collection}', which is not a directory in this repo."
              exit 1
            fi
            files+=("${collection}")
          done
          # ustar, not GNU tar's default: PHP's PharData cannot read GNU long-name headers
          # (a path over 100 bytes fails the import), and silently truncates posix/pax names.
          # ustar splits long paths into prefix and name, and refuses a basename it cannot hold.
          tar --format=ustar -czf feeds.tar.gz "${files[@]}"
          echo "Packaged ${#files[@]} root entries into feeds.tar.gz ($(stat -c %s feeds.tar.gz) bytes)."

      - name: POST to Craft webhook
        env:
          WEBHOOK_URL: ${{ inputs.webhook-url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # Status, headers and body are captured separately: a non-2xx can
          # come from Cloudflare or from Craft, and the headers tell them apart.
          status=$(curl -sS \
            -o response.txt \
            -D response-headers.txt \
            -w '%{http_code}' \
            -X POST \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @feeds.tar.gz \
            "${WEBHOOK_URL}")
          echo "HTTP ${status}"
          # Allowlist only — a raw dump can carry Set-Cookie (Cloudflare
          # clearance / app session cookies).
          echo "--- response headers (diagnostic subset) ---"
          tr -d '\r' < response-headers.txt \
            | grep -iE '^(HTTP/|server:|cf-ray:|cf-mitigated:|cf-access-aud:|cf-cache-status:|content-type:|retry-after:)' \
            || true
          echo "--- response body ---"
          cat response.txt || true
          echo "---"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            echo "::error::Craft webhook returned HTTP ${status}. See response body above for the failing section / reason."
            exit 1
          fi

      # Polls the queue job and the Feed Me sequence the sync response names, in one request with
      # one combined state. `waiting` and `reserved` keep polling, `done` lets the sites rebuild,
      # `failed` fails the run at once. Only this sync's own job id and sequence key are asked
      # about: CAPSTONE answers `done` for one it does not know.
      - name: Wait for the import
        id: wait
        if: ${{ inputs.rebuild-sites != '' }}
        env:
          WEBHOOK_URL: ${{ inputs.webhook-url }}
          SITE: ${{ inputs.site }}
          WAIT_SECONDS: ${{ inputs.wait-seconds }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # CAPSTONE always sends `import`: null when the sync queued nothing, else an object
          # holding the job id. Anything else is a response this step cannot trust, not "no import".
          # `none` cannot be a job id: jq passes digits only.
          job=$(jq -r '
            if type != "object" or (has("import") | not) then error("no import key")
            elif .import == null then "none"
            elif (.import | type) != "object" then error("import is not an object")
            else .import.jobId
              | if type == "string" or type == "number" then tostring else error("no job id") end
              | if test("^[0-9]+$") then . else error("job id is not a number") end
            end' response.txt 2>/dev/null) || job=''
          # `feedMe` names the Feed Me sequence the sync queued for its CSVs. Null, or no key at
          # all (an image that predates it), is no sequence. Any other shape is not followed.
          # The key grammar is the issuer's, FeedMeSequence::KEY_PATTERN in craft-data-sync.
          sequence=$(jq -r '
            if type != "object" then error("not an object")
            elif (has("feedMe") | not) or .feedMe == null then "none"
            elif (.feedMe | type) != "object" then error("feedMe is not an object")
            else .feedMe.sequence
              | if type == "string" and test("^ds[0-9]{7,25}$") then . else error("no sequence key") end
            end' response.txt 2>/dev/null) || sequence=''
          if [[ "${job}" != "none" && ! "${job}" =~ ^[0-9]+$ ]]; then
            echo "::error::The sync response carries neither \"import\": null nor a numeric import job id, so the import cannot be followed. Nothing was rebuilt."
            exit 1
          fi
          if [[ "${sequence}" != "none" && ! "${sequence}" =~ ^ds[0-9]{7,25}$ ]]; then
            echo "::error::The sync response carries a feedMe value this step cannot follow. Nothing was rebuilt."
            exit 1
          fi
          # A sync asks for a sequence with the query parameter feedMe=queue, name and value
          # exact. The last `feedMe` wins, as it does when Craft reads the query.
          asked=''
          if [[ "${WEBHOOK_URL}" == *\?* ]]; then
            query="${WEBHOOK_URL#*\?}"
            IFS='&' read -r -a params <<< "${query%%#*}"
            for param in "${params[@]}"; do
              if [[ "${param}" == feedMe=* ]]; then
                asked="${param#feedMe=}"
              fi
            done
          fi
          # No sequence is then a CAPSTONE that ignored the request or had nothing to queue.
          # Following the job alone would rebuild the sites before any CSV import.
          if [[ "${asked}" == "queue" && "${sequence}" == "none" ]]; then
            echo "::error::CAPSTONE queued no Feed Me sequence although this sync asked for one (feedMe=queue). Likely an image without the feature, no feed matching the staged CSVs, or a storage account mismatch. The data was sent; only the rebuild was withheld. Nothing was rebuilt."
            exit 1
          fi
          if [[ "${job}" == "none" && "${sequence}" == "none" ]]; then
            echo "::notice::The sync queued no import, so there is nothing to wait for and no site is rebuilt."
            echo "queued=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${WEBHOOK_URL%%\?*}"
          status_url="${base%/sync}/status?site=${SITE}"
          what=''
          label=''
          verb='was'
          if [[ "${job}" != "none" ]]; then
            status_url+="&job=${job}"
            what="Import job ${job}"
            label="job ${job}"
          fi
          if [[ "${sequence}" != "none" ]]; then
            status_url+="&sequence=${sequence}"
            if [[ -n "${what}" ]]; then
              what+=' and '
              label+=', '
              verb='were'
            fi
            what+="Feed Me sequence ${sequence}"
            label+="sequence ${sequence}"
          fi
          deadline=$((SECONDS + WAIT_SECONDS))
          # Fewest feeds the sequence has had left. Only a count below it restarts the deadline,
          # so a stalled sequence times out and the restarts are bounded by the first count.
          lowest=''
          # The count in the newest answer that carried one, for the timeout message.
          latest=''
          # The deadline is checked after a poll, not before, so the import is always asked once
          # more when the time is up.
          while true; do
            # curl prints 000 itself when it fails, so the fallback only keeps `set -e` quiet.
            code=$(curl -sS --max-time 30 -o status.json -w '%{http_code}' \
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              "${status_url}" || true)
            case "${code}" in
              200)
                # A 200 that is not the JSON answer (an edge page) is retried like any other miss.
                state=$(jq -r '.state? // empty' status.json 2>/dev/null || true)
                echo "${label}: ${state:-unreadable}"
                # Read only when a sequence is followed, so a job alone keeps its fixed deadline.
                remaining=''
                if [[ "${sequence}" != "none" ]]; then
                  # A JSON number only: the string "0" is not a count.
                  remaining=$(jq -r '.csv.remaining? | select(type == "number" and . >= 0 and . == floor)' status.json 2>/dev/null || true)
                  if [[ ! "${remaining}" =~ ^[0-9]+$ ]]; then
                    remaining=''
                  else
                    latest="${remaining}"
                  fi
                  if [[ -z "${remaining}" ]]; then
                    :
                  elif [[ -z "${lowest}" ]]; then
                    lowest="${remaining}"
                    echo "csv: ${remaining} feed(s) left"
                  elif (( remaining < lowest )); then
                    lowest="${remaining}"
                    deadline=$((SECONDS + WAIT_SECONDS))
                    echo "csv: ${remaining} feed(s) left"
                  fi
                fi
                case "${state}" in
                  done)
                    # An answer without the count comes from an image that ignored the sequence
                    # and spoke for the job alone.
                    if [[ "${sequence}" != "none" && -z "${remaining}" ]]; then
                      echo "::error::CAPSTONE answered done without reporting on Feed Me sequence ${sequence}, so its import cannot be confirmed. Nothing was rebuilt."
                      exit 1
                    fi
                    # `done` and feeds left contradict each other; trust neither.
                    if [[ "${sequence}" != "none" ]] && (( remaining != 0 )); then
                      echo "::error::CAPSTONE answered done with ${remaining} feed(s) left in Feed Me sequence ${sequence}. Nothing was rebuilt."
                      exit 1
                    fi
                    echo "queued=true" >> "${GITHUB_OUTPUT}"
                    exit 0
                    ;;
                  failed)
                    echo "::error::${what} failed. Read it in the CAPSTONE queue manager; nothing was rebuilt."
                    exit 1
                    ;;
                esac
                ;;
              404)
                echo "::error::CAPSTONE has no /feeds/status route; its image predates it. Nothing was rebuilt."
                exit 1
                ;;
            esac
            if (( SECONDS >= deadline )); then
              break
            fi
            sleep 5
          done
          left=''
          progress=''
          if [[ "${sequence}" != "none" ]]; then
            progress=' without progress'
            if [[ -n "${latest}" ]]; then
              left=" (${latest} feed(s) left)"
            fi
          fi
          echo "::error::${what}${left} ${verb} not done after ${WAIT_SECONDS}s${progress}. Nothing was rebuilt; the daily build is the fallback."
          exit 1

      # An App token, not GITHUB_TOKEN: a dispatch made with GITHUB_TOKEN starts no workflow.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ steps.wait.outputs.queued == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REBUILD_APP_CLIENT_ID }}
          private-key: ${{ secrets.REBUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.rebuild-sites }}
          permission-actions: write

      - name: Rebuild the dependent sites
        if: ${{ steps.wait.outputs.queued == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SITES: ${{ inputs.rebuild-sites }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for site in ${SITES//,/ }; do
            if gh workflow run deploy.yml --repo "${OWNER}/${site}" --ref main; then
              echo "dispatched ${site}"
            else
              echo "::error::Could not dispatch deploy.yml on ${site}."
              failed=1
            fi
          done
          exit "${failed}"
