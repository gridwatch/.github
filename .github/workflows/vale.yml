---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Vale

on:
  workflow_call:
    inputs:
      # Callers always pass this; the default only backstops a hand-written one.
      glob:
        description: "Vale --glob pattern selecting the files to lint"
        type: string
        default: '!{_vendor,layouts,node_modules,public,vendor,.specify,specs,.claude}/**'
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # private repository reads. Optional so public and fork callers run.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  vale:
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Mints a per-run installation token for the private repository read below.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Cloned as a sibling because .vale.ini points its StylesPath at
      # ../tooling. When the caller IS tooling, ../tooling is the workspace
      # itself: use the checkout, or the clone fails on a non-empty destination.
      - name: Checkout tooling
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -d ../tooling ]; then
            echo "../tooling is the workspace itself; using the checkout"
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/gridwatch/tooling.git" ../tooling
          fi

      - name: Install Vale
        env:
          VALE_VERSION: "3.21.0"
          VALE_SHA256: "96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336"
        run: |
          install_dir="$(mktemp -d)"
          tarball="${install_dir}/vale.tar.gz"
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o "${tarball}"
          echo "${VALE_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "${install_dir}/bin"
          tar -xzf "${tarball}" -C "${install_dir}/bin" vale
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      # A repo with its own .vale.ini lints against it; everything else uses the
      # shared config. `vale sync` fetches the style packages, gitignored in
      # tooling and so absent from the fresh clone.
      - name: Run Vale
        env:
          VALE_GLOB: ${{ inputs.glob }}
        run: |
          config="../tooling/vale.ini"
          if [ -f .vale.ini ]; then
            config=".vale.ini"
          fi
          vale sync --config "${config}"
          vale --config "${config}" --glob "${VALE_GLOB}" .
