---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Checkov

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The shared config lives in the public `.github` repository, so this
      # clone needs no credentials and behaves identically for a private
      # caller, a public one, and a fork's pull request.
      #
      # It is cloned outside the workspace so the scan does not walk into it,
      # then copied in — checkov-action is a Docker action and the runner mounts
      # only the workspace, so a path outside it is unreadable from inside the
      # container. The copy runs on the host, before the container starts.
      - name: Checkout Checkov config
        run: |
          git clone --depth 1 --branch main --single-branch https://github.com/gridwatch/.github.git ../fleet-config
          cp ../fleet-config/checkov.yml .checkov.yml

      # see: https://github.com/bridgecrewio/checkov-action/tree/v12.3119.0
      - uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8  # v12.3119.0
        with:
          config_file: .checkov.yml
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: results.sarif
          quiet: true
          soft_fail: true

      # see: https://github.com/github/codeql-action/releases/tag/v4.37.8
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: results.sarif
        continue-on-error: true
