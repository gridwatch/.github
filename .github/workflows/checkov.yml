---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Checkov

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Config comes from the public `.github` repo, so no credential is needed.
      # Cloned outside the workspace so the scan skips it, then copied in:
      # checkov-action is a Docker action and only the workspace is mounted.
      - name: Checkout Checkov config
        run: |
          git clone --depth 1 --branch main --single-branch https://github.com/gridwatch/.github.git ../fleet-config
          cp ../fleet-config/checkov.yml .checkov.yml

      # see: https://github.com/bridgecrewio/checkov-action/tree/v12.3119.0
      - uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8  # v12.3119.0
        with:
          config_file: .checkov.yml
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: results.sarif
          quiet: true
          soft_fail: true

      # Replaces a SARIF upload that was 44s of a 72s job and could never land:
      # Code Security is disabled on every Terraform repo, so the API answered
      # 403 while `continue-on-error` reported it green.
      - name: Summarise findings
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Checkov"
            echo
            if [ ! -f results.sarif ]; then
              echo "No results file was produced."
            elif [ "$(jq '[.runs[]?.results[]?] | length' results.sarif)" -eq 0 ]; then
              echo "No failed checks."
            else
              echo "| Check | Description | Location |"
              echo "|---|---|---|"
              # Every field is optional in SARIF, and `set -e` would turn a
              # missing one into a red build on a scan that is advisory today.
              jq -r '.runs[]?.results[]? | [
                  (.ruleId // "unknown"),
                  ((.message.text // "") | gsub("\\s+"; " ") | gsub("\\|"; "\\|")),
                  ((.locations[0].physicalLocation.artifactLocation.uri // "unknown")
                    + ":" + ((.locations[0].physicalLocation.region.startLine // 0) | tostring))
                ] | "| " + join(" | ") + " |"' results.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"
