---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Validate Data Feeds

# Runs `12b feeds validate` against the calling repo's working tree, checking
# each <section>.csv against the Craft field definitions in the
# <section>.schema.json beside it.
#
# This is separate from the prose Super-Linter because Super-Linter ships no CSV
# linter at all — v8 has no VALIDATE_CSV and no csvlint in the image — so the CSV
# content of world-data and sim-data is unreachable through that path.
#
# Shaped after gridwatch/registries' fdt-validate.yml, which runs the sibling
# `12b validate` the same way: check twelve-bravo out alongside the tree under
# test and `go run` it, rather than building and caching a binary. The validator
# is sub-second on the live feeds, so that keeps the workflow surface minimal —
# no artifact handling, no cache keys.

on:
  workflow_call:
    inputs:
      citation-urls:
        description: "'required' (world-data cites every row) or 'forbidden' (sim-data generates content)"
        type: string
        required: true
      pooled-sections:
        description: "'allow' permits <section>-<pool>.csv sharing one schema (sim-data), 'deny' is one CSV per schema"
        type: string
        default: deny
      twelve-bravo-ref:
        description: 'Commit SHA of gridwatch/twelve-bravo to run the validator from'
        type: string
        required: true
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # private repository reads. Optional so public and fork callers run.
      REPO_ACCESS_APP_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here — where secrets are legal — to one non-secret boolean the
    # mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    steps:
      # persist-credentials: false so the token backing the checkout below is
      # never written into a .git/config the `go run` step could read back.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Checkout feeds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: feeds
          persist-credentials: false

      # Pinned to a commit SHA rather than main, so a twelve-bravo merge cannot
      # silently change what this gate accepts. Bumping it is an explicit,
      # reviewable change to twelve_bravo_ref in infrastructure-github.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      # Mints a per-run installation token for the private repository
      # reads below — about an hour's life, contents read.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout twelve-bravo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gridwatch/twelve-bravo
          ref: ${{ inputs.twelve-bravo-ref }}
          path: twelve-bravo
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: twelve-bravo/go.mod

      - name: Run 12b feeds validate
        working-directory: twelve-bravo
        env:
          CITATION_URLS: ${{ inputs.citation-urls }}
          POOLED_SECTIONS: ${{ inputs.pooled-sections }}
        run: |
          go run ./cmd/12b feeds validate \
            --root ../feeds \
            --citation-urls "${CITATION_URLS}" \
            --pooled-sections "${POOLED_SECTIONS}"
