---

# Managed by gridwatch/infrastructure-github.
# Manual edits will be overwritten on the next `terraform apply`.
#
# Action pins live in its `locals.tf`. Never merge a Dependabot pull request
# against this file; bump the pin there instead.

name: Validate Data Feeds

# Checks each <section>.csv against the <section>.schema.json beside it.
# Separate from the prose Super-Linter because Super-Linter v8 ships no CSV
# linter at all, leaving world-data and sim-data unreachable through that path.

on:
  workflow_call:
    inputs:
      citation-urls:
        description: "'required' (world-data cites every row) or 'forbidden' (sim-data generates content)"
        type: string
        required: true
      pooled-sections:
        description: "'allow' permits <section>-<pool>.csv sharing one schema (sim-data), 'deny' is one CSV per schema"
        type: string
        default: deny
      twelve-bravo-ref:
        description: 'Commit SHA of gridwatch/twelve-bravo to run the validator from'
        type: string
        required: true
      also-root-repo:
        description: |
          Another gridwatch feed repo whose root schemas join 12b's global handle check, by name
          (for example 'world-data'). Nothing in it is validated and no finding is attributed to
          it. Empty runs no cross-repo check.
        type: string
        default: ''
      theater-server-ref:
        description: |
          Commit SHA of gridwatch/theater-server to run `content validate` from, the game-rule
          half of the gate. Empty skips it, which is what a repo holding no game content does.
        type: string
        default: ''
    secrets:
      # The repo-access App halves, minted below into a per-run token for
      # private repository reads. Optional so public and fork callers run.
      REPO_ACCESS_APP_CLIENT_ID:
        required: false
      REPO_ACCESS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    # A step `if` cannot read the secrets context, so the two App halves are
    # reduced here to one non-secret boolean the mint step's condition can test.
    env:
      APP_AUTH_CONFIGURED: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID != '' && secrets.REPO_ACCESS_APP_PRIVATE_KEY != '' }}
    steps:
      # persist-credentials: false so the token backing the checkout below is
      # never written into a .git/config the `go run` step could read back.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Checkout feeds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: feeds
          persist-credentials: false

      # Mints a per-run installation token for the private repository reads below.
      #
      # see: https://github.com/actions/create-github-app-token/releases/tag/v3.2.0
      - id: app-token
        if: ${{ env.APP_AUTH_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Three checkouts, then the private Go modules both validators import.
          repositories: |
            twelve-bravo
            theater-server
            world-data
            go-cli-app
            go-server
            design-system
          permission-contents: read

      # Pinned, so a twelve-bravo merge cannot change what this gate accepts.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Checkout twelve-bravo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gridwatch/twelve-bravo
          ref: ${{ inputs.twelve-bravo-ref }}
          path: twelve-bravo
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Deliberately unpinned, unlike the two validators: this is not a gate input but the other
      # half of a "do these two repos agree right now" question, and pinning it would let a
      # world-data handle change go unnoticed here until somebody bumped a SHA.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Checkout the cross-repo handle source
        if: ${{ inputs.also-root-repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gridwatch/${{ inputs.also-root-repo }}
          path: ${{ inputs.also-root-repo }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # No vendor directory, so its modules are fetched at run time.
      #
      # see: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Checkout theater-server
        if: ${{ inputs.theater-server-ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gridwatch/theater-server
          ref: ${{ inputs.theater-server-ref }}
          path: theater-server
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # After every checkout, before either `go run`.
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::the validators need the repo-access App token for the private gridwatch modules"
            exit 1
          fi
          echo "GOPRIVATE=github.com/gridwatch/*" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/gridwatch/".insteadOf "https://github.com/gridwatch/"

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: twelve-bravo/go.mod

      - name: Run 12b feeds validate
        working-directory: twelve-bravo
        # `shell: bash` is explicit: the optional flag is carried in an array, and an empty array
        # expanding to nothing under `set -u` is a bash 4.4+ behaviour, not a POSIX sh one.
        shell: bash
        env:
          CITATION_URLS: ${{ inputs.citation-urls }}
          POOLED_SECTIONS: ${{ inputs.pooled-sections }}
          ALSO_ROOT: ${{ inputs.also-root-repo }}
        run: |
          set -euo pipefail
          also_root=()
          if [[ -n "${ALSO_ROOT}" ]]; then
            also_root=(--also-root "../${ALSO_ROOT}")
          fi
          go run ./cmd/12b feeds validate \
            --root ../feeds \
            --citation-urls "${CITATION_URLS}" \
            --pooled-sections "${POOLED_SECTIONS}" \
            "${also_root[@]}"

      # see: https://github.com/actions/setup-go/releases/tag/v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: ${{ inputs.theater-server-ref != '' }}
        with:
          go-version-file: theater-server/go.mod

      - name: Run theater-server content validate
        if: ${{ inputs.theater-server-ref != '' }}
        working-directory: theater-server
        run: go run ./cmd/server content validate --dir ../feeds
